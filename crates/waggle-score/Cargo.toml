[package]
name = "waggle-score"
version = "3.1.0"
edition = "2021"
authors = ["Waggle Core Engineering Team"]
description = "Deterministic zero-knowledge fit scoring engine and Merkle verification crate for Waggle v3"

[dependencies]
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
alloy-primitives = { version = "0.8", default-features = false }
alloy-sol-types = { version = "0.8", default-features = false }

[dev-dependencies]
serde_json = "1.0"
